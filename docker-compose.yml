name: smart-transit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
      POSTGRES_DB: transit
    ports:
      # Host port is configurable in case 5432 is already used on the machine (DB_PORT=5433 docker compose up)
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://transit:transit@db:5432/transit?schema=public
      CORS_ORIGIN: "*"
      ALERT_WINDOW_MINUTES: ${ALERT_WINDOW_MINUTES:-10}
      ALERT_MIN_REPORTS: ${ALERT_MIN_REPORTS:-3}
      REPORT_COOLDOWN_SECONDS: ${REPORT_COOLDOWN_SECONDS:-30}
      JWT_SECRET: ${JWT_SECRET:-smart-transit-demo-secret}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
