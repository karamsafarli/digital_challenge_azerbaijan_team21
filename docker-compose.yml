services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
      POSTGRES_DB: transit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://transit:transit@db:5432/transit?schema=public
      CORS_ORIGIN: "*"
      ALERT_WINDOW_MINUTES: ${ALERT_WINDOW_MINUTES:-10}
      ALERT_MIN_REPORTS: ${ALERT_MIN_REPORTS:-3}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
